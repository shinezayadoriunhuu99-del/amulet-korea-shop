<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#176b45">
  <title>AMULET KOREA</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="brand">AMULET <span>KOREA</span></div>
  <button id="cartBtn">🛒 <b id="cartCount">0</b></button>
</header>

<main>
  <section class="hero">
    <small>СОЛОНГОСООС ШУУД</small>
    <h1>100% ОРИГИНАЛ БАРАА</h1>
    <p>Гоо сайхан • Гутал • Хувцас • Хүүхдийн бараа</p>
  </section>

  <div class="search">
    <input id="search" placeholder="Бараа хайх...">
  </div>

  <div id="categories" class="chips"></div>

  <div class="sectionTitle">
    <h2>Онцлох бараа</h2>
  </div>

  <section id="products" class="grid">
    <p>Бараа ачаалж байна...</p>
  </section>
</main>

<nav>
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
    🏠<span>Нүүр</span>
  </button>

  <button id="navCategories">
    ▦<span>Ангилал</span>
  </button>

  <button id="navCart">
    🛒<span>Сагс</span>
  </button>

</nav>

<div id="drawer" class="drawer hidden">
  <div class="sheet">

    <div class="sheetHead">
      <h2>Таны сагс</h2>
      <button id="closeDrawer">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Нийт: <b id="cartTotal">0₮</b>
    </div>

    <form id="orderForm">
      <input id="customerName"
             required
             placeholder="Нэр">

      <input id="phone"
             required
             placeholder="Утас">

      <textarea id="address"
                placeholder="Хаяг / нэмэлт мэдээлэл"></textarea>

      <button class="primary" type="submit">
        Захиалга илгээх
      </button>
    </form>

    <p id="orderMsg"></p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
